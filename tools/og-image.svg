<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- drifting lights, echoing the page -->
  <g fill="#22c55e" filter="url(#soft)">
    <circle cx="140" cy="150" r="4" fill-opacity="0.55"/>
    <circle cx="1040" cy="120" r="3" fill-opacity="0.45"/>
    <circle cx="980" cy="470" r="5" fill-opacity="0.4"/>
    <circle cx="220" cy="500" r="3" fill-opacity="0.5"/>
    <circle cx="620" cy="90" r="2.5" fill-opacity="0.35"/>
    <circle cx="1120" cy="330" r="3.5" fill-opacity="0.3"/>
  </g>

  <!-- brand -->
  <text x="80" y="105" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#22c55e">&gt;_</text>
  <text x="126" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#ececee">The 2AM System</text>

  <!-- headline -->
  <text x="80" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#ececee" letter-spacing="-2">Your AI forgets everything</text>
  <text x="80" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#ececee" letter-spacing="-2">you told it <tspan fill="#22c55e">yesterday.</tspan></text>

  <!-- subline -->
  <text x="80" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#8f8f99">One Obsidian vault, wired to Claude, that remembers.</text>

  <!-- footer strip -->
  <rect x="80" y="486" width="112" height="46" rx="23" fill="#22c55e"/>
  <text x="136" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#06210f" text-anchor="middle">$27</text>

  <text x="212" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8f8f99">founder price &#183; drops August 2026</text>

  <text x="1120" y="517" font-family="Consolas, Menlo, monospace" font-size="21" fill="#8f8f99" text-anchor="end">2am-system.vercel.app</text>
</svg>
